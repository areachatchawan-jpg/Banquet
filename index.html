<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banquet &amp; Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fafbfc; --ink:#14161a; --ink-2:#5b6472;
  --line:#e2e5ea; --line-2:#eef0f3;
  --accent:#6b3fa0; --accent-ink:#ffffff; --accent-soft:#f1ebf8;
  --gold:#a8812c; --gold-soft:#fbf4e4;
  --ok:#1f7a4d; --ok-soft:#e6f4ec;
  --warn:#9a6a10; --warn-soft:#fdf3df;
  --draft:#5b6472; --draft-soft:#eef0f3;
  --radius:12px; --shadow:0 1px 2px rgba(16,20,28,.06), 0 6px 18px rgba(16,20,28,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --panel:#191c21; --panel-2:#15181c; --ink:#eceef1; --ink-2:#9aa3af;
    --line:#282d34; --line-2:#20242a;
    --accent:#b493de; --accent-ink:#18101f; --accent-soft:#2a2233;
    --gold:#d8b45f; --gold-soft:#2c2618;
    --ok:#6cc79a; --ok-soft:#18271f;
    --warn:#d9ab55; --warn-soft:#2a2418;
    --draft:#9aa3af; --draft-soft:#22262c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#101215; --panel:#191c21; --panel-2:#15181c; --ink:#eceef1; --ink-2:#9aa3af;
  --line:#282d34; --line-2:#20242a;
  --accent:#b493de; --accent-ink:#18101f; --accent-soft:#2a2233;
  --gold:#d8b45f; --gold-soft:#2c2618;
  --ok:#6cc79a; --ok-soft:#18271f;
  --warn:#d9ab55; --warn-soft:#2a2418;
  --draft:#9aa3af; --draft-soft:#22262c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 96px}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--accent-soft) 0%, var(--bg) 72%);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.bar{max-width:1180px;margin:0 auto;padding:10px 14px}
.brandrow{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.icb{flex:0 0 auto;width:36px;height:36px;border:1px solid var(--line);background:var(--panel);
  border-radius:11px;font-size:15px;cursor:pointer;padding:0;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.icb:active{transform:scale(.94)}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo img{height:40px;width:auto;max-width:150px;object-fit:contain;display:block;
  background:#fff;border-radius:8px;padding:3px 6px}
.logo svg{height:34px;width:auto;display:block}
.strip{height:4px;border-radius:3px;margin:-1px 0 9px;
  background:linear-gradient(90deg, var(--brand,#6b3fa0) 0%, var(--gold) 45%, var(--accent) 100%);
  box-shadow:0 1px 6px var(--accent-soft)}
.scanbtn{width:100%;margin:0 0 12px;padding:11px;border-radius:12px;font-size:14px;font-weight:600;
  border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.scanbtn:active{transform:scale(.99)}
.beohead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);margin:12px 0}
.beohead img{height:56px;max-width:190px;object-fit:contain;background:#fff;border-radius:8px;padding:4px 7px}
.beohead svg{height:46px;width:auto}
.beohead .t{flex:1;min-width:0}
.beohead .t b{display:block;font-size:14px}
.beohead .t span{font-size:12px;color:var(--ink-2)}
.hotels{display:flex;gap:6px;background:var(--line-2);padding:3px;border-radius:10px}
.hotels button{
  flex:1;border:0;background:transparent;padding:7px 10px;border-radius:8px;
  font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2);white-space:nowrap
}
.hotels button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filters input,.filters select{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;min-width:0
}
.filters input[type="search"]{flex:1;min-width:130px}

/* ---------- summary ---------- */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat .k{font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.stat .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- list ---------- */
.card{
  -webkit-tap-highlight-color:rgba(107,63,160,.12);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer
}
.card:active{transform:scale(.995)}
.card .r1{display:flex;align-items:flex-start;gap:8px}
.card .date{
  background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:6px 9px;
  text-align:center;min-width:56px;font-weight:700;line-height:1.15
}
.card .date small{display:block;font-size:10px;font-weight:600;opacity:.85}
.card .co{flex:1;min-width:0}
.card .co b{display:block;font-size:14.5px;font-weight:600}
.card .co span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .r2{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-2)}
.card .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.t-final{background:var(--ok-soft);color:var(--ok)}
.t-confirm{background:var(--gold-soft);color:var(--gold)}
.t-tentative{background:var(--warn-soft);color:var(--warn)}
.t-draft{background:var(--draft-soft);color:var(--draft)}
.pill{font-size:11.5px;color:var(--ink-2);background:var(--line-2);padding:3px 8px;border-radius:999px}

table.grid{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:13.5px}
table.grid th{background:var(--panel-2);text-align:left;padding:9px 10px;font-size:12px;
  color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--line)}
table.grid td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.grid tr:last-child td{border-bottom:0}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:var(--panel-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.desk{display:none}
@media(min-width:860px){ .desk{display:block} .mob{display:none} .summary{grid-template-columns:repeat(4,1fr)} }

.empty{text-align:center;color:var(--ink-2);padding:44px 16px;font-size:14px}

/* ---------- fab ---------- */
.fab2{
  position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;
  padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.scanning{position:fixed;inset:0;z-index:70;background:rgba(10,12,16,.72);
  display:none;align-items:center;justify-content:center;padding:24px}
.scanning.on{display:flex}
.scanbox{background:var(--panel);border-radius:14px;padding:20px 22px;max-width:340px;width:100%;text-align:center}
.scanbox b{display:block;font-size:15px;margin-bottom:6px}
.scanbox p{margin:0 0 14px;font-size:13px;color:var(--ink-2);line-height:1.5}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fab{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;
  padding:13px 20px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2)
}

/* ---------- editor ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none}
.sheet.on{display:block}
.sheet .bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:8px;align-items:center;z-index:5}
.sheet .bar h2{font-size:15px;flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;
  font-size:14px;font-weight:500;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.dang{color:#c0392b;border-color:#e8bcb6}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.sm.pri{padding:6px 12px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  margin:12px 0;overflow:hidden}
.sec>summary{padding:12px 14px;font-weight:600;font-size:14px;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"▾";margin-left:auto;color:var(--ink-2);font-size:12px}
.sec[open]>summary{border-bottom:1px solid var(--line-2)}
.sec[open]>summary::after{content:"▴"}
.secbody{padding:12px 14px}
.f{margin-bottom:11px}
.f label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;font-size:15px}
.f textarea{min-height:88px;resize:vertical;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.line{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;background:var(--panel-2)}
.line .lh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.line .lh b{font-size:12.5px;color:var(--ink-2)}
.line .tot{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.gtot{display:flex;align-items:center;padding:12px 14px;border-top:1px solid var(--line);
  font-weight:700;background:var(--panel-2)}
.gtot span:last-child{margin-left:auto;font-size:18px;font-variant-numeric:tabular-nums}
.hint{font-size:11.5px;color:var(--ink-2);margin-top:-4px;margin-bottom:10px}
.grp{margin-bottom:14px}
.grp .gh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.grp .gh b{font-size:12.5px}
.grp .gh i{font-style:normal;font-size:11px;color:var(--ink-2);margin-left:auto;
  background:var(--line-2);padding:2px 7px;border-radius:999px}
.grp .gh i.full{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:6px 11px;font-size:13px;cursor:pointer;line-height:1.3;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.fixed{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;
  padding:9px 11px;margin-bottom:7px;font-size:12.5px;color:var(--ink-2)}
.fixed b{display:block;color:var(--ink);font-size:11.5px;margin-bottom:2px;letter-spacing:.02em}
.setlist{columns:2;column-gap:14px;font-size:12.5px}
@media(max-width:560px){ .setlist{columns:1} }
.setlist div{break-inside:avoid;margin-bottom:8px}
.setlist b{display:block;font-size:11px;color:var(--accent);letter-spacing:.03em;margin-bottom:1px}
.setlist span{display:block;color:var(--ink-2);line-height:1.45}
.files{margin-bottom:10px}
.fitem{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);
  border-radius:10px;padding:8px;margin-bottom:8px;background:var(--panel-2)}
.fitem>a{flex:0 0 76px}
.fitem img{width:76px;height:58px;object-fit:cover;display:block;background:#fff;border-radius:6px}
.fitem .doc{width:76px;height:58px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:#fff;border-radius:6px}
.fitem .fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fitem select{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:5px 7px;font-size:12.5px;width:100%}
.fitem .fn{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .fx{flex:0 0 24px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px;padding:0}
.dthumbs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.dthumbs a{display:block;width:84px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dthumbs img{width:100%;height:56px;object-fit:cover;display:block;background:#fff}
.money{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel-2);
  font-size:13px;flex-wrap:wrap}
.money div{flex:1;min-width:92px}
.money span{display:block;font-size:11px;color:var(--ink-2)}
.money b{font-size:16px;font-variant-numeric:tabular-nums}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 108px;font-weight:500;color:var(--ink-2);font-size:12.5px}
.kv span{flex:1;min-width:0;word-break:break-word}
.vrow{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.vrow:last-child{border-bottom:0}
.vrow .vt{flex:1;min-width:0}
.vrow .vt small{display:block;color:var(--ink-2);font-size:12px;margin-top:1px}
.vrow .vn{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.vtask{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px}
.vtask .tick{flex:0 0 24px;height:24px;border:1px solid var(--line);background:var(--panel-2);
  border-radius:7px;cursor:pointer;font-size:11px;color:transparent;padding:0}
.vtask .tick[aria-pressed="true"]{background:var(--ok);border-color:transparent;color:#fff}
.vtask.done span{text-decoration:line-through;color:var(--ink-2)}
.vtask small{color:var(--accent);font-weight:600;white-space:nowrap}
.rd{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.rd:last-child{border-bottom:0}
.rd b{flex:0 0 62px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;font-size:13px}
.rd span{flex:1;min-width:0}
.rd small{color:var(--ink-2);white-space:nowrap;font-size:12px}
.rdrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.rdrow .rt{flex:0 0 74px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.rdrow .ri{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13.5px}
.rdrow .rw{flex:0 0 78px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px}
.rdrow .del{flex:0 0 24px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px;padding:0}
.same{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;background:var(--panel-2);cursor:pointer;font-size:13px}
.same b{flex:1;min-width:0;font-weight:600}
.gate{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  padding:22px;overflow-y:auto;
  background:
    radial-gradient(120% 80% at 50% -10%, var(--brand,#6b3fa0) 0%, transparent 62%),
    radial-gradient(90% 60% at 110% 110%, var(--gold) 0%, transparent 55%),
    var(--bg);}
.gate.on{display:flex}
.gate::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.88) 45%, var(--bg) 100%)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gate::after{
  background:linear-gradient(180deg, rgba(16,18,21,.45) 0%, rgba(16,18,21,.86) 45%, var(--bg) 100%)} }
:root[data-theme="dark"] .gate::after{
  background:linear-gradient(180deg, rgba(16,18,21,.45) 0%, rgba(16,18,21,.86) 45%, var(--bg) 100%)}
.gatebox{position:relative;z-index:1;width:100%;max-width:352px;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:30px 26px 24px;box-shadow:0 2px 6px rgba(16,20,28,.06), 0 24px 60px rgba(16,20,28,.16)}
.gatebox .gl{margin-bottom:6px;display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap}
.gatebox .gl img{height:56px;width:auto;max-width:132px;object-fit:contain;
  background:#fff;border-radius:10px;padding:5px 8px}
.gatebox .gl svg{height:56px;width:auto}
.gatebox .rule{width:42px;height:2px;border-radius:2px;margin:16px auto 14px;
  background:linear-gradient(90deg,var(--accent),var(--gold))}
.gatebox h2{font-size:19px;letter-spacing:-.01em;margin-bottom:5px}
.gatebox p{margin:0 0 20px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.gatebox input{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;
  padding:14px;font-size:17px;text-align:center;letter-spacing:4px;margin-bottom:6px;
  transition:border-color .15s, box-shadow .15s}
.gatebox input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
.gatebox input::placeholder{letter-spacing:0;color:var(--ink-2);opacity:.6}
.gatebox .btn{width:100%;margin-bottom:9px;padding:13px;font-size:15px;border-radius:12px}
.gatebox .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);
  font-weight:500;margin-bottom:0}
.gatebox .btn.ghost:active{background:var(--line-2)}
.gatebox .err{color:#c0392b;font-size:12.5px;min-height:20px;line-height:1.5}
.gatebox .foot{margin-top:18px;padding-top:15px;border-top:1px solid var(--line-2);
  font-size:11px;color:var(--ink-2);letter-spacing:.04em}
.roletag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,10,14,.94);display:none;flex-direction:column}
.lb.on{display:flex}
.lbbar{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fff}
.lbbar .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.lbbar button,.lbbar a{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;
  border-radius:9px;padding:7px 12px;font-size:14px;cursor:pointer;text-decoration:none;line-height:1}
.lbwrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center}
.lbwrap img{display:block;width:100%;height:auto;transition:width .18s}
.br{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:13px}
.br .bl{flex:0 0 116px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .bb{flex:1;height:9px;background:var(--line-2);border-radius:999px;overflow:hidden}
.br .bb i{display:block;height:100%;background:var(--accent);border-radius:999px}
.br .bv{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
.rep h3{margin:0 0 3px;font-size:13px}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px}
.rtab th{text-align:left;padding:6px 6px;color:var(--ink-2);font-size:11.5px;border-bottom:1px solid var(--line)}
.rtab td{padding:6px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.rtab td.n{text-align:right;font-variant-numeric:tabular-nums}
.vdept{margin-bottom:13px}
.vdept>h4{margin:0 0 4px;font-size:12.5px;color:var(--ink-2);display:flex;gap:8px}
.vdept>h4 i{font-style:normal;margin-left:auto;background:var(--line-2);padding:1px 7px;border-radius:999px;font-size:11px}
.vdept>h4 i.full{background:var(--ok-soft);color:var(--ok);font-weight:600}
.picked{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.task{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.task .tick{flex:0 0 28px;height:28px;border:1px solid var(--line);background:var(--panel);
  border-radius:8px;cursor:pointer;font-size:13px;color:transparent;padding:0}
.task .tick[aria-pressed="true"]{background:var(--ok);border-color:transparent;color:#fff}
.task .tt{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;font-size:13.5px}
.task .tw{flex:0 0 92px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;font-size:12.5px}
.task .del{flex:0 0 26px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px;padding:0}
.task.done .tt{text-decoration:line-through;color:var(--ink-2)}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow)}
.dcard .dh{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px;
  padding-bottom:9px;border-bottom:1px solid var(--line-2);cursor:pointer}
.dcard .dh .co b{display:block;font-size:14.5px}
.dcard .dh .co span{display:block;font-size:12.5px;color:var(--ink-2)}
.dcard .tl{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13.5px}
.dcard .tl .tick{flex:0 0 26px;height:26px;border:1px solid var(--line);background:var(--panel-2);
  border-radius:7px;cursor:pointer;font-size:12px;color:transparent;padding:0}
.dcard .tl .tick[aria-pressed="true"]{background:var(--ok);border-color:transparent;color:#fff}
.dcard .tl.done span{text-decoration:line-through;color:var(--ink-2)}
.dcard .tl small{color:var(--accent);font-weight:600;white-space:nowrap}
.dcard .nomore{font-size:12.5px;color:var(--ink-2);padding:4px 0}
.viewsw{display:flex;gap:6px;background:var(--line-2);padding:3px;border-radius:10px;margin-top:8px}
.viewsw button{flex:1;border:0;background:transparent;padding:7px 10px;border-radius:8px;
  font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.viewsw button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:.95}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}

@media print{
  header,.fab,.filters,.summary,.sheet .bar,.btn{display:none !important}
  .beohead{border:0;padding:0 0 10px;border-bottom:2px solid #333}
  body{background:#fff;color:#000;font-size:12px}
  .sheet{position:static;display:block}
  .sec{break-inside:avoid;border:1px solid #999}
  .sec>summary{background:#eee}
  .fitem{width:46%} .fitem img{height:auto;max-height:340px;object-fit:contain} .fitem .fx{display:none}
  details:not([open])>*:not(summary){display:block !important}
}

/* ---- งานตามแผนก ---- */
function taskList(f,k){
  const v=(f.depts||{})[k];
  if(Array.isArray(v)) return v;
  if(typeof v==="string" && v.trim())
    return v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(t=>({t:t,done:false,who:""}));
  return [];
}
function ensureArr(f,k){ f.depts=f.depts||{}; if(!Array.isArray(f.depts[k])) f.depts[k]=taskList(f,k); return f.depts[k]; }
function deptStats(f){ let d=0,t=0; DEPTS.forEach(x=>taskList(f,x.k).forEach(i=>{t++; if(i.done)d++;})); return {d,t}; }
function deptName(k){ const x=DEPTS.find(d=>d.k===k); return x?x.l:k; }

/* month filter options */
(function(){
  const sel=$("#fMonth"); const now=new Date();
  let html='<option value="">ทุกเดือน</option>';
  for(let i=-6;i<=12;i++){
    const d=new Date(now.getFullYear(), now.getMonth()+i, 1);
    const v=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const label=d.toLocaleDateString("th-TH",{month:"short",year:"numeric"});
    html+=`<option value="${v}"${i===0?" selected":""}>${label}</option>`;
  }
  sel.innerHTML=html;
})();

let SB=null;
const CFG_OK = ()=> typeof APP_CONFIG!=="undefined" && APP_CONFIG.supabaseUrl && APP_CONFIG.supabaseAnonKey
  && !APP_CONFIG.supabaseUrl.includes("ใส่");

async function sbLoadAll(){
  const [fn,st] = await Promise.all([
    SB.from("functions").select("id,data"),
    SB.from("settings").select("id,data")
  ]);
  if(fn.error) throw fn.error;
  ITEMS = (fn.data||[]).map(r=>({id:r.id, ...(r.data||{})}));
  const S={}; (st.data||[]).forEach(r=>S[r.id]=r.data||{});
  return S;
}
async function sbSaveFunction(id,body){
  const row={id:id||("f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
             data:body, updated_at:new Date().toISOString()};
  const {error}=await SB.from("functions").upsert(row);
  if(error) throw error;
  return row.id;
}
async function sbDeleteFunction(id){
  const {error}=await SB.from("functions").delete().eq("id",id);
  if(error) throw error;
}
async function sbSaveSetting(key,obj){
  const {error}=await SB.from("settings").upsert({id:key,data:obj,updated_at:new Date().toISOString()});
  if(error) throw error;
}
async function sbUpload(file){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase();
  const path=Date.now().toString(36)+Math.random().toString(36).slice(2,8)+"."+ext;
  const {error}=await SB.storage.from("files").upload(path,file,{upsert:false,contentType:file.type});
  if(error) throw error;
  return SB.storage.from("files").getPublicUrl(path).data.publicUrl;
}
async function askBEO(files,prompt){
  const url=(APP_CONFIG.beoFunctionUrl||"").trim();
  if(!url) throw {code:"not_configured"};
  const fd=new FormData();
  fd.append("prompt",prompt);
  files.forEach((f,i)=>fd.append("image"+i,f));
  const r=await fetch(url,{method:"POST",headers:{Authorization:"Bearer "+APP_CONFIG.supabaseAnonKey},body:fd});
  if(!r.ok) throw {code:"http_"+r.status};
  return await r.json();
}

async function boot(){
  drawTabs(); drawBrand(); drawView(); applyRole(); render();
  if(!CFG_OK()){
    $("#warn").innerHTML='<div class="banner">ยังไม่ได้ตั้งค่า Supabase — เปิดไฟล์ <b>config.js</b> แล้วใส่ Project URL กับ anon key</div>';
    READONLY=true; GATED=true; applyRole(); return;
  }
  SB = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
  DB = true; ASSETS = true;
  SAMPLE = !!(APP_CONFIG.beoFunctionUrl||"").trim();

  async function refresh(){
    try{
      const S = await sbLoadAll();
      LOGOS = S.logos || {};
      CFG   = S.config || {};
      applyCfg(CFG);
      if(S.depts && Array.isArray(S.depts.list) && S.depts.list.length) DEPTS=S.depts.list;
      if(!DEPTS.some(x=>x.k===MYDEPT)) MYDEPT=DEPTS[0].k;
      if(!GATED){ GATED=true;
        const need=(CFG.adminCode||CFG.staffCode);
        if(need && !localStorage.getItem("bqRole")) showGate();
        else if(!need && !localStorage.getItem("bqRole")) ROLE="admin";
      }
      drawTabs(); drawBrand(); drawView(); applyRole(); render();
      if($("#sheet").classList.contains("on") && CUR && CUR.id){
        const fresh=ITEMS.find(x=>x.id===CUR.id);
        if(fresh && MODE==="view"){ CUR=JSON.parse(JSON.stringify(fresh)); drawSheet(); }
      }
    }catch(e){
      $("#warn").innerHTML='<div class="banner">เชื่อมต่อฐานข้อมูลไม่ได้: '+esc(e.message||e.code||"error")+'</div>';
    }
  }
  await refresh();
  SB.channel("all").on("postgres_changes",{event:"*",schema:"public"},()=>refresh()).subscribe();
  setInterval(refresh, 60000);
}

function filtered(){
  const q=$("#q").value.trim().toLowerCase(), m=$("#fMonth").value, st=$("#fStatus").value;
  return ITEMS.filter(f=>{
    if(f.hotel!==HOTEL) return false;
    if(st && f.status!==st) return false;
    if(m && !(f.dateFrom||"").startsWith(m)) return false;
    if(q){
      const hay=((f.company||"")+" "+(f.funcNo||"")+" "+(f.eventName||"")+" "+(f.contact||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>(a.dateFrom||"").localeCompare(b.dateFrom||""));
}
function dparts(iso){
  if(!iso) return {d:"–",m:""};
  const dt=new Date(iso+"T00:00:00");
  if(isNaN(dt)) return {d:"–",m:""};
  return {d:dt.getDate(), m:dt.toLocaleDateString("th-TH",{month:"short"})};
}
function rangeText(f){
  if(!f.dateFrom) return "–";
  const a=new Date(f.dateFrom+"T00:00:00");
  const s=a.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"});
  if(!f.dateTo||f.dateTo===f.dateFrom) return s;
  const b=new Date(f.dateTo+"T00:00:00");
  return a.getDate()+"–"+b.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"});
}
function tagCls(s){ return "t-"+String(s||"Draft").toLowerCase(); }

function daysFromToday(iso){
  if(!iso) return 9999;
  const a=new Date(iso+"T00:00:00"), t=new Date(); t.setHours(0,0,0,0);
  return Math.round((a-t)/86400000);
}

function bar(label,val,max,extra){
  const pc=max>0?Math.round(val/max*100):0;
  return `<div class="br"><span class="bl" title="${esc(label)}">${esc(label)}</span>
    <span class="bb"><i style="width:${pc}%"></i></span>
    <span class="bv">${extra||nf(val)}</span></div>`;
}
function reportRows(){
  const m=$("#fMonth").value, st=$("#fStatus").value, q=$("#q").value.trim().toLowerCase();
  return ITEMS.filter(f=>{
    if(st && f.status!==st) return false;
    if(m && !(f.dateFrom||"").startsWith(m)) return false;
    if(q){ const hay=((f.company||"")+" "+(f.funcNo||"")+" "+(f.eventName||"")).toLowerCase();
      if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>(a.dateFrom||"").localeCompare(b.dateFrom||""));
}
function renderReport(){

  const kArr=Object.entries(byKind).sort((a,b)=>b[1].n-a[1].n);
  const kMaxN=Math.max(1,...kArr.map(x=>x[1].n));

  /* --- รายได้แยกประเภทรายการ --- */

  /* --- เมนูยอดนิยม --- */
  const dish={}, sets={};
  rows.forEach(f=>(f.menus||[]).forEach(m=>{
    if(m.set) sets[m.set]=(sets[m.set]||0)+1;
    const p=m.picks||{};
    Object.keys(p).forEach(g=>{ if(g==="brk"||g.startsWith("cb")) return;
      (p[g]||[]).forEach(d=>{ dish[d]=(dish[d]||0)+1; }); });
  }));
  const dArr=Object.entries(dish).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const dMax=Math.max(1,...dArr.map(x=>x[1]));
  const dishHTML=dArr.length?dArr.map(([k,v])=>bar(k,v,dMax,v+" ครั้ง")).join("")

  /* --- อาหารว่าง --- */

  rows.forEach(f=>(f.menus||[]).forEach(m=>{ const p=m.picks||{};
    Object.keys(p).forEach(g=>{ if(g!=="brk" && !g.startsWith("cb")) return;
      (p[g]||[]).forEach(d=>{ brk[d]=(brk[d]||0)+1; }); }); }));
  const bArr=Object.entries(brk).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const bMax=Math.max(1,...bArr.map(x=>x[1]));
  const brkHTML=bArr.length?bArr.map(([k,v])=>bar(k,v,bMax,v+" ครั้ง")).join(""):"";

  /* --- ชุดเมนู --- */
  const sArr=Object.entries(sets).sort((a,b)=>b[1]-a[1]);
  const sMax=Math.max(1,...sArr.map(x=>x[1]));
  const setHTML=sArr.map(([k,v])=>bar(k,v,sMax,v+" มื้อ")).join("");

  /* --- ห้องที่ใช้ --- */
  const room={}; rows.forEach(f=>{ const r=(f.sessions||[])[0]?.room; if(r) room[r]=(room[r]||0)+1; });
  const rArr=Object.entries(room).sort((a,b)=>b[1]-a[1]);
  const rMax=Math.max(1,...rArr.map(x=>x[1]));
  const roomHTML=rArr.map(([k,v])=>bar(k,v,rMax,v+" งาน")).join("");

  /* --- ตารางงาน --- */
  const tableHTML=`<table class="rtab"><thead><tr><th>วันที่</th><th>ลูกค้า</th><th>ประเภท</th>
    <th>โรงแรม</th><th class="n">Pax</th><th class="n">ยอด</th></tr></thead><tbody>
    ${rows.map(f=>`<tr><td>${esc(rangeText(f))}</td>
      <td>${esc(f.company||"(ไม่ระบุ)")}<br><span style="color:var(--ink-2)">${esc(f.eventName||"")}</span></td>
      <td>${esc(f.kind||KINDS[0])}</td><td>${esc((HOTELS[f.hotel]||{short:""}).short)}</td>
      <td class="n">${nf(maxPax(f))}</td><td class="n">${nf(funcTotal(f))}</td></tr>`).join("")}
    <tr><td colspan="5"><b>รวม</b></td><td class="n"><b>${nf(tot)}</b></td></tr>
    </tbody></table>`;

  $("#list").innerHTML=`<div class="rep">
    <div class="sec"><div class="secbody"><h3>รายได้แยกโรงแรม</h3>
      <div class="hint">รายงานรวมทั้ง 2 โรงแรมเสมอ ไม่ขึ้นกับแท็บที่เลือก</div>${hotelHTML}</div></div>
    <div class="sec"><div class="secbody"><h3>ประเภทงาน</h3>
      <div class="hint">เรียงตามจำนวนงาน</div>${kindHTML}</div></div>
    <div class="sec"><div class="secbody"><h3>รายได้แยกประเภทรายการ</h3>
      <div class="hint">อาหาร ค่าเช่าห้อง อุปกรณ์ ฯลฯ</div>${typeHTML}</div></div>
    <div class="sec"><div class="secbody"><h3>เมนูอาหารที่ลูกค้าเลือกบ่อย</h3>
      <div class="hint">นับจากรายการที่ติ๊กในเมนูงานประชุม (15 อันดับแรก)</div>${dishHTML}</div></div>
    ${brkHTML?`<div class="sec"><div class="secbody"><h3>อาหารว่างที่ใช้บ่อย</h3>${brkHTML}</div></div>`:""}
    ${setHTML?`<div class="sec"><div class="secbody"><h3>ชุดเมนูที่ใช้บ่อย</h3>${setHTML}</div></div>`:""}
    ${roomHTML?`<div class="sec"><div class="secbody"><h3>ห้องที่ใช้บ่อย</h3>${roomHTML}</div></div>`:""}
    <div class="sec"><div class="secbody"><h3>รายการงานทั้งหมด</h3>
      <div style="overflow-x:auto">${tableHTML}</div></div></div>

  document.getElementById("repPrint").onclick=()=>window.print();

      ? `<div class="tl"><span style="color:var(--ink-2)">เมนู: ${esc((f.menus||[]).map(m=>(m.date||"")+" "+(m.set||"")).join(" · "))}</span></div>` : "";

          ${x.who?`<small>${esc(x.who)}</small>`:""}
        </div>`).join("")
        : '<div class="nomore">ยังไม่มีงานมอบหมายให้แผนกนี้</div>'}

  bindZoom($("#list"));

function redrawRd(focus){
  const box=document.getElementById("rdBox"); if(!box) return;
  CUR.rundown=CUR.rundown||[];
  box.innerHTML=CUR.rundown.map((r,i)=>rdHTML(r,i)).join("");
  box.closest(".sec").querySelector(".pill").textContent=CUR.rundown.length;
  bindRd();
  if(focus!=null){ const el=box.querySelector(`.rdrow[data-ri="${focus}"] .ri`); if(el) el.focus(); }
}
function bindRd(){
  const box=document.getElementById("rdBox"); if(!box) return;
  box.querySelectorAll(".rdrow").forEach(row=>{
    const i=+row.dataset.ri, r=CUR.rundown[i]; if(!r) return;
    row.querySelector(".rt").oninput=e=>{ r.time=e.target.value; };
    row.querySelector(".rw").oninput=e=>{ r.who=e.target.value; };
    const it=row.querySelector(".ri");
    it.oninput=e=>{ r.item=e.target.value; };
    it.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault();
      CUR.rundown.splice(i+1,0,{time:"",item:"",who:""}); redrawRd(i+1); } };
    it.onpaste=e=>{
      const txt=(e.clipboardData||window.clipboardData).getData("text")||"";
      const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      if(lines.length<2) return;
      e.preventDefault();
      const parsed=lines.map(L=>{
        const m=L.match(/^(\d{1,2}[.:]\d{2})\s*(?:น\.)?\s*(.*)$/);
        return m?{time:m[1].replace(":","."),item:m[2].trim(),who:""}:{time:"",item:L,who:""};
      });
      CUR.rundown.splice(i,1,...parsed); redrawRd(i+parsed.length-1);
    };
    row.querySelector(".del").onclick=()=>{ CUR.rundown.splice(i,1); redrawRd(); };
  });
}

function bindDepts(){
  const box=document.getElementById("deptBox"); if(!box) return;
  box.querySelectorAll("[data-addtask]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.addtask, arr=ensureArr(CUR,k);
    arr.push({t:"",done:false,who:""}); redrawDepts([k,arr.length-1]);
  });
  box.querySelectorAll(".task").forEach(row=>{
    const k=row.dataset.tk, i=+row.dataset.ti;
    const arr=ensureArr(CUR,k); const item=arr[i]; if(!item) return;
    row.querySelector(".tt").oninput=e=>{ item.t=e.target.value; };
    row.querySelector(".tw").oninput=e=>{ item.who=e.target.value; };
    row.querySelector(".tt").onkeydown=e=>{
      if(e.key==="Enter"){ e.preventDefault(); arr.splice(i+1,0,{t:"",done:false,who:""}); redrawDepts([k,i+1]); }
      if(e.key==="Backspace" && !item.t && arr.length>1){ e.preventDefault(); arr.splice(i,1); redrawDepts([k,Math.max(0,i-1)]); }
    };
    row.querySelector(".tt").onpaste=e=>{
      const txt=(e.clipboardData||window.clipboardData).getData("text")||"";
      const lines=txt.split(/\r?\n/).map(x=>x.replace(/^[\s*•\-]+/,"").trim()).filter(Boolean);
      if(lines.length<2) return;
      e.preventDefault();
      item.t=lines[0];
      lines.slice(1).forEach((t,n)=>arr.splice(i+1+n,0,{t:t,done:false,who:""}));
      redrawDepts([k,i+lines.length-1]);
    };
    row.querySelector(".tick").onclick=()=>{ item.done=!item.done; redrawDepts(); };
    row.querySelector(".del").onclick=()=>{ arr.splice(i,1); redrawDepts(); };
  });
}

function menuHTML(m,i){

    }).join("") + (def.fixed||[]).map(([t,v])=>

  } else if(BUFFETS[set]){

function pickedText(m){
  const def=MENUDEFS[m.set||""]; if(!def) return "";
  const p=m.picks||{}, out=[];
  def.groups.forEach(g=>{ if((p[g.k]||[]).length) out.push((p[g.k]||[]).join(" · ")); });
  return out.join(" · ");
}
function toggleChip(i,gk,val){
  const m=CUR.menus[i]; m.picks=m.picks||{};
  const arr=m.picks[gk]=m.picks[gk]||[];
  const at=arr.indexOf(val);
  if(at>=0) arr.splice(at,1); else arr.push(val);
}

function bindForm(rooms){
  if(!document.getElementById("roomList")){
    const dl=document.createElement("datalist"); dl.id="roomList"; document.body.appendChild(dl);
  }
  document.getElementById("roomList").innerHTML = rooms.map(r=>`<option value="${esc(r)}">`).join("");

  $("#form").querySelectorAll("[data-k]").forEach(el=>el.oninput=()=>{
    CUR[el.dataset.k]=el.value;
    if(el.dataset.k==="hotel"||el.dataset.k==="kind"){ drawForm(); }
  });
  bindDepts();
  $("#form").querySelectorAll("[data-si]").forEach(box=>{
    const i=+box.dataset.si;
    box.querySelectorAll("[data-s]").forEach(el=>el.oninput=()=>{
      CUR.sessions[i][el.dataset.s]=el.value;
      box.querySelector(".tot").textContent=nf(sessTotal(CUR.sessions[i]));
      $("#grand").textContent=nf(funcTotal(CUR));
      const dd=document.getElementById("due"); if(dd) dd.textContent=nf(funcTotal(CUR)-(Number(CUR.deposit)||0));
    });
  });
  $("#form").querySelectorAll("[data-mi]").forEach(box=>{
    const i=+box.dataset.mi;
    box.querySelectorAll("[data-m]").forEach(el=>el.oninput=()=>{
      CUR.menus[i][el.dataset.m]=el.value;
      if(el.dataset.m==="set"){ CUR.menus[i].picks={}; redrawMenus(); }
    });
    box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
      toggleChip(i,c.dataset.g,c.dataset.v);
      const on=c.getAttribute("aria-pressed")!=="true";
      c.setAttribute("aria-pressed",on);
      const grp=c.closest(".grp"), badge=grp.querySelector(".gh i");
      const n=grp.querySelectorAll('.chip[aria-pressed="true"]').length;
      const max=(badge.textContent.split("/")[1]||"").trim();
      badge.textContent = max ? n+"/"+max : n+" รายการ";
      if(max) badge.classList.toggle("full", n>=Number(max));
      const pv=box.querySelector(".picked");
      pv.innerHTML = esc(pickedText(CUR.menus[i]))||"<span style='opacity:.6'>ยังไม่ได้เลือกรายการ</span>";
    });
  });
  $("#form").querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.dup; CUR.sessions.splice(i+1,0,{...CUR.sessions[i]}); drawForm(); });
  $("#form").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    CUR.sessions.splice(+b.dataset.del,1); drawForm(); });
  $("#form").querySelectorAll("[data-mdel]").forEach(b=>b.onclick=()=>{
    CUR.menus.splice(+b.dataset.mdel,1); redrawMenus(); });
  $("#form").querySelectorAll("[data-mcopy]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.mcopy;
    CUR.menus.splice(i+1,0,JSON.parse(JSON.stringify(CUR.menus[i]))); redrawMenus(); });
  $("#addSess").onclick=()=>{
    const last=CUR.sessions[CUR.sessions.length-1]||{};
    CUR.sessions.push({date:last.date||"",time:"12.00 - 13.00",room:last.room||rooms[0],type:"Lunch",price:600,pax:last.pax||55,qty:1});
    drawForm(); };
  $("#addMenu").onclick=()=>{ CUR.menus=CUR.menus||[];
    const last=CUR.menus[CUR.menus.length-1]||{};
    CUR.menus.push({date:"",set:last.set||"Meeting Set (เลือกรายการ)",meal:"อาหารกลางวัน",pax:last.pax||"",items:"",picks:{}});
    redrawMenus(); };
  const del=$("#delBtn"); if(del) del.onclick=async()=>{
    if(!confirm("ลบงานนี้ถาวร?")) return;
    try{ await sbDeleteFunction(CUR.id); toast("ลบแล้ว"); close(); }
    catch(e){ toast("ลบไม่ได้: "+e.code); }
  };
}

function applyScan(d){
  if(!d||typeof d!=="object"){ toast("อ่านข้อมูลไม่ได้"); return; }
  const f=blank();
  ["funcNo","company","taxId","address","contact","phone","email","eventName",
   "dateFrom","dateTo","status","sales","incharge","remark","kind"].forEach(k=>{
    if(typeof d[k]==="string" && d[k].trim()) f[k]=d[k].trim();
  });
  if(!STATUSES.includes(f.status)) f.status="Draft";
  if(!KINDS.includes(f.kind)) f.kind=KINDS[0];
  if(Number(d.deposit)) f.deposit=Number(d.deposit);
  if(typeof d.receiptNo==="string") f.receiptNo=d.receiptNo;
  if(typeof d.theme==="string") f.theme=d.theme;
  f.rundown = Array.isArray(d.rundown)?d.rundown.map(r=>({time:String(r.time||""),item:String(r.item||""),who:String(r.who||"")})):[];
  if(Array.isArray(d.sessions) && d.sessions.length){
    f.sessions=d.sessions.map(x=>({
      date:String(x.date||""), time:String(x.time||""), room:String(x.room||""),
      type:TYPES.includes(x.type)?x.type:"อื่นๆ",
      price:Number(x.price)||0, pax:Number(x.pax)||0, qty:Number(x.qty)||1 }));
  }
  f.menus = Array.isArray(d.menus) ? d.menus.map(x=>({
    date:String(x.date||""), meal:String(x.meal||"อาหารกลางวัน"),
    set:MENUSETS.includes(x.set)?x.set:"อื่นๆ",
    pax:String(x.pax||""), items:String(x.items||""), picks:{} })) : [];
  f.files=[];
  f.depts={};
  if(d.depts && typeof d.depts==="object"){
    Object.entries(d.depts).forEach(([k,v])=>{
      if(!DEPTS.some(x=>x.k===k)) return;
      const arr=Array.isArray(v)?v:String(v||"").split(/\r?\n/);
      f.depts[k]=arr.map(t=>String(t).replace(/^[\s*•\-]+/,"").trim()).filter(Boolean)
        .map(t=>({t:t,done:false,who:""}));
    });
  }
  const n=Object.values(f.depts).reduce((a,x)=>a+x.length,0);
  CUR=f; MODE="edit"; drawSheet(); $("#sheet").classList.add("on"); document.body.style.overflow="hidden";
  toast("อ่านได้ "+(f.sessions||[]).length+" รอบ · "+n+" งานแผนก — ตรวจสอบก่อนบันทึก");
}

$("#gateView").onclick=()=>enterAs("view");
$("#outBtn").onclick=()=>{ ROLE="view"; try{localStorage.removeItem("bqRole");}catch(e){} applyRole(); showGate(); };

/* ================= ตั้งค่าระบบ (แอดมิน) ================= */
function hex2rgba(h,a){
  h=(h||"#6b3fa0").replace("#","");
  if(h.length===3) h=h.split("").map(c=>c+c).join("");
  const n=parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function applyCfg(c){
  c=c||{};
  if(Array.isArray(c.hotels)&&c.hotels.length){
    const H={},ord=[];
    c.hotels.forEach(x=>{ if(!x||!x.k) return;
      H[x.k]={name:x.name||x.short||x.k,short:x.short||x.name||x.k,
        color:x.color||"#6b3fa0",rooms:Array.isArray(x.rooms)?x.rooms:[]};
      ord.push(x.k); });
    if(ord.length){ HOTELS=H; HOTEL_ORDER=ord; if(!HOTELS[HOTEL]) HOTEL=ord[0]; }
  }
  KINDS     = (Array.isArray(c.kinds)&&c.kinds.length)?c.kinds:[...DEF_KINDS];
  TYPES     = (Array.isArray(c.types)&&c.types.length)?c.types:[...DEF_TYPES];
  MENUSETS  = (Array.isArray(c.menusets)&&c.menusets.length)?c.menusets:[...DEF_MENUSETS];
  FILETAGS  = (Array.isArray(c.filetags)&&c.filetags.length)?c.filetags:[...DEF_FILETAGS];
  RENTAL_KINDS = Array.isArray(c.rentalKinds)?c.rentalKinds:["คอนเสิร์ต / แฟนมีต","เช่าห้องอย่างเดียว"];
  APPTITLE  = c.title || "Banquet & Event";
  document.title = APPTITLE;
  if(c.accent){
    const r=document.documentElement.style;
    r.setProperty("--accent",c.accent);
    r.setProperty("--accent-soft",hex2rgba(c.accent,.14));
    r.setProperty("--accent-ink","#ffffff");
  }
}
let CFG={}, GATED=false, LOGOTARGET=null;
function drawCfg(){
  const hotels = HOTEL_ORDER.map(k=>({k,...HOTELS[k]}));
  $("#cForm").innerHTML=`
  <details class="sec" open><summary>ทั่วไป</summary><div class="secbody">
    <div class="f"><label>ชื่อเว็บ</label><input id="cTitle" value="${esc(APPTITLE)}"></div>
    <div class="f"><label>สีหลักของเว็บ</label>
      <input type="color" id="cAccent" value="${esc(CFG.accent||"#6b3fa0")}" style="height:44px;padding:4px"></div>
    <div class="hint">สีนี้ใช้กับปุ่ม วันที่ และแถบต่างๆ ทั้งเว็บ</div>
    <div class="row2">
      <div class="f"><label>รหัสแอดมิน</label><input id="cAdminCode" value="${esc(CFG.adminCode||"")}" placeholder="แก้ไขได้ทุกอย่าง"></div>
      <div class="f"><label>รหัสพนักงานแผนก</label><input id="cStaffCode" value="${esc(CFG.staffCode||"")}" placeholder="ติ๊กงานเสร็จได้"></div>
    </div>
    <div class="hint">เว้นว่างทั้งคู่ = ไม่ต้องใส่รหัส ใครเปิดก็เป็นแอดมิน · คนที่ไม่มีรหัสยังกด "เข้าดูอย่างเดียว" ได้เสมอ</div>
  </div></details>

  <details class="sec" open><summary>โรงแรม <span class="pill">${hotels.length}</span></summary><div class="secbody">
    <div class="hint">แก้ชื่อ สีประจำโรงแรม และรายชื่อห้อง (บรรทัดละ 1 ห้อง)</div>
    <div id="cHotels">${hotels.map((h,i)=>hotelBlock(h,i)).join("")}</div>
    <button class="btn sm" id="cAddHotel">+ เพิ่มโรงแรม</button>
  </div></details>

  <details class="sec"><summary>แผนก <span class="pill">${DEPTS.length}</span></summary><div class="secbody">
    <div class="hint">ลบแผนกออกได้ งานที่บันทึกไว้แล้วไม่หาย</div>
    <div id="cDepts"></div>
    <button class="btn sm" id="cAddDept">+ เพิ่มแผนก</button>
  </div></details>

  ${listSec("ประเภทงาน","cKinds",KINDS,"งานที่เป็นประเภทเช่าห้อง/คอนเสิร์ต จะซ่อนหัวข้อเมนูอัตโนมัติ")}
  ${listSec("ประเภทงานที่ไม่มีอาหาร","cRental",RENTAL_KINDS,"พิมพ์ชื่อประเภทงานให้ตรงกับด้านบน")}
  ${listSec("ประเภทรายการ / ค่าใช้จ่าย","cTypes",TYPES,"ใช้ในหัวข้อ รอบ / ห้อง / ราคา")}
  ${listSec("ชุดเมนู","cMenusets",MENUSETS,"")}
  ${listSec("ป้ายกำกับไฟล์แนบ","cFiletags",FILETAGS,"")}

  <button class="btn dang" id="cReset" style="width:100%;margin-top:6px">คืนค่าเริ่มต้นทั้งหมด</button>
  <div style="height:24px"></div>`;
  drawCDepts();
  bindCfg();
}
function listSec(title,id,arr,hint){
  return `<details class="sec"><summary>${esc(title)} <span class="pill">${arr.length}</span></summary><div class="secbody">
    ${hint?`<div class="hint">${esc(hint)}</div>`:""}
    <div class="f"><label>บรรทัดละ 1 รายการ</label>
      <textarea id="${id}" style="min-height:130px">${esc(arr.join("\n"))}</textarea></div>
  </div></details>`;
}
function hotelBlock(h,i){
  return `<div class="line" data-hi="${i}">
    <div class="lh"><b>โรงแรมที่ ${i+1}</b>
      <button class="btn sm" style="margin-left:auto" data-hdel="${i}">ลบ</button></div>
    <div class="row2">
      <div class="f"><label>ชื่อย่อ (แสดงบนแท็บ)</label><input class="hs" value="${esc(h.short)}"></div>
      <div class="f"><label>สีประจำโรงแรม</label><input type="color" class="hc" value="${esc(h.color||"#6b3fa0")}" style="height:40px;padding:3px"></div>
    </div>
    <div class="f"><label>โลโก้</label>
      <div style="display:flex;gap:10px;align-items:center">
        <span style="flex:0 0 auto;color:${esc(h.color||"#6b3fa0")};display:flex">${LOGOS[h.k]?`<img src="${esc(LOGOS[h.k])}" style="height:38px;background:#fff;border-radius:8px;padding:3px 6px">`:(h.k==="bys"?LOGO_B:LOGO_Q).replace("<svg ",'<svg style="height:38px" ')}</span>
        <button type="button" class="btn sm" data-hlogo="${esc(h.k)}">เปลี่ยนโลโก้</button>
      </div></div>
    <div class="f"><label>ชื่อเต็ม</label><input class="hn" value="${esc(h.name)}"></div>
    <div class="f"><label>รายชื่อห้อง (บรรทัดละ 1 ห้อง)</label>
      <textarea class="hr" style="min-height:90px">${esc((h.rooms||[]).join("\n"))}</textarea></div>
  </div>`;
}
let CTMP=[];
function drawCDepts(){
  const box=document.getElementById("cDepts"); if(!box) return;
  box.innerHTML=CTMP.map((d,i)=>`<div class="task" data-cdi="${i}">
    <input class="tt" value="${esc(d.l)}"><button type="button" class="del">✕</button></div>`).join("");
  box.querySelectorAll(".task").forEach(r=>{
    const i=+r.dataset.cdi;
    r.querySelector(".tt").oninput=e=>{ CTMP[i].l=e.target.value; };
    r.querySelector(".del").onclick=()=>{ CTMP.splice(i,1); drawCDepts(); };
  });
}
function bindCfg(){
  $("#cForm").querySelectorAll("[data-hdel]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.hdel; const arr=readHotels();
    if(arr.length<=1){ toast("ต้องมีอย่างน้อย 1 โรงแรม"); return; }
    arr.splice(i,1); HOTELS={}; HOTEL_ORDER=[];
    arr.forEach(h=>{ HOTELS[h.k]=h; HOTEL_ORDER.push(h.k); });
    drawCfg();
  });
  $("#cForm").querySelectorAll("[data-hlogo]").forEach(b=>b.onclick=()=>{
    if(!ASSETS){ toast("หน้านี้อัปโหลดไม่ได้"); return; }
    LOGOTARGET=b.dataset.hlogo; $("#logoFile").click();
  });
  $("#cAddHotel").onclick=()=>{
    const arr=readHotels();
    const k="h"+Date.now().toString(36);
    arr.push({k,short:"โรงแรมใหม่",name:"โรงแรมใหม่",color:"#1b5f96",rooms:[]});
    HOTELS={}; HOTEL_ORDER=[];
    arr.forEach(h=>{ HOTELS[h.k]=h; HOTEL_ORDER.push(h.k); });
    drawCfg();
  };
  $("#cAddDept").onclick=()=>{ CTMP.push({k:"d"+Date.now().toString(36),l:""}); drawCDepts(); };
  $("#cReset").onclick=async()=>{
    if(!confirm("คืนค่าเริ่มต้นทั้งหมด?\nชื่อโรงแรม สี หัวข้อ และแผนก จะกลับเป็นค่าตั้งต้น\nข้อมูลงานไม่หาย")) return;
    if(!DB) return;
    try{ await sbSaveSetting("config",{});
         await sbSaveSetting("depts",{list:DEFAULT_DEPTS});
         toast("คืนค่าแล้ว"); $("#cBack").click(); }
    catch(e){ toast("ไม่สำเร็จ: "+(e.code||"error")); }
  };
}
function readHotels(){
  const out=[];
  $("#cForm").querySelectorAll("[data-hi]").forEach(row=>{
    const i=+row.dataset.hi, k=HOTEL_ORDER[i]||("h"+i);
    out.push({k,
      short:row.querySelector(".hs").value.trim()||"โรงแรม",
      name:row.querySelector(".hn").value.trim()||"โรงแรม",
      color:row.querySelector(".hc").value,
      rooms:row.querySelector(".hr").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)});
  });
  return out;
}
const lines = id => ($("#"+id)?.value||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

$("#cfgBtn").onclick=()=>{
  CTMP=JSON.parse(JSON.stringify(DEPTS));
  drawCfg(); $("#csheet").classList.add("on"); document.body.style.overflow="hidden";
};
$("#cBack").onclick=()=>{ $("#csheet").classList.remove("on"); document.body.style.overflow=""; };
$("#cSave").onclick=async()=>{
  if(!DB){ toast("บันทึกไม่ได้ในหน้านี้"); return; }
  const cfg={
    title:$("#cTitle").value.trim()||"Banquet & Event",
    accent:$("#cAccent").value,
    adminCode:$("#cAdminCode").value.trim(),
    staffCode:$("#cStaffCode").value.trim(),
    hotels:readHotels(),
    kinds:lines("cKinds"), rentalKinds:lines("cRental"), types:lines("cTypes"),
    menusets:lines("cMenusets"), filetags:lines("cFiletags")
  };
  const depts=CTMP.filter(d=>(d.l||"").trim());
  if(!depts.length){ toast("ต้องมีอย่างน้อย 1 แผนก"); return; }
  if(!cfg.hotels.length){ toast("ต้องมีอย่างน้อย 1 โรงแรม"); return; }
  try{
    await sbSaveSetting("config",cfg);
    await sbSaveSetting("depts",{list:depts});
    toast("บันทึกแล้ว"); $("#cBack").click();
  }catch(e){ toast("บันทึกไม่สำเร็จ: "+(e.code||"error")); }
};

/* ---- ตั้งค่าชื่อแผนก ---- */
let DTMP=[];
$("#deptCfg").onclick=()=>{ DTMP=JSON.parse(JSON.stringify(DEPTS)); drawDList();
  $("#dsheet").classList.add("on"); document.body.style.overflow="hidden"; };
$("#dBack").onclick=()=>{ $("#dsheet").classList.remove("on"); document.body.style.overflow=""; };
function drawDList(){
  $("#dList").innerHTML=DTMP.map((d,i)=>`<div class="task" data-di="${i}">
    <input class="tt" value="${esc(d.l)}"><button type="button" class="del">✕</button></div>`).join("");
  $("#dList").querySelectorAll(".task").forEach(r=>{
    const i=+r.dataset.di;
    r.querySelector(".tt").oninput=e=>{ DTMP[i].l=e.target.value; };
    r.querySelector(".del").onclick=()=>{ DTMP.splice(i,1); drawDList(); };
  });
}
$("#dAdd").onclick=()=>{ DTMP.push({k:"d"+Date.now().toString(36),l:""}); drawDList(); };
$("#dSave").onclick=async()=>{
  const list=DTMP.filter(d=>(d.l||"").trim());
  if(!list.length){ toast("ต้องมีอย่างน้อย 1 แผนก"); return; }
  if(!DB){ toast("บันทึกไม่ได้ในหน้านี้"); return; }
  try{ await sbSaveSetting("depts",{list:list}); toast("บันทึกแล้ว"); $("#dBack").click(); }
  catch(e){ toast("บันทึกไม่สำเร็จ: "+(e.code||"error")); }
};

/* ---- อัปโหลดโลโก้ ---- */
$("#logoBtn").onclick=()=>$("#logoFile").click();
$("#logoFile").onchange=async e=>{
  const file=e.target.files&&e.target.files[0]; e.target.value="";
  if(!file) return;
  if(!ASSETS||!DB){ toast("อัปโหลดไม่ได้ในหน้านี้"); return; }
  if(file.size>2*1024*1024){ toast("ไฟล์ใหญ่เกิน 2 MB"); return; }
  toast("กำลังอัปโหลด...");
  try{
    const u=await sbUpload(file);
    const next={...LOGOS, [LOGOTARGET||HOTEL]:u};
    await sbSaveSetting("logos",next);
    const hk=LOGOTARGET||HOTEL; LOGOTARGET=null;
    LOGOS=next; drawBrand();
    if($("#csheet").classList.contains("on")) drawCfg();
    toast("เปลี่ยนโลโก้ "+(HOTELS[hk]||{short:""}).short+" แล้ว");
  }catch(err){ toast("อัปโหลดไม่สำเร็จ: "+(err.code||"error")); }
};

function beoHeadHTML(f){
  const hk=f.hotel||HOTEL, h=HOTELS[hk];
  return logoHTML(hk)+`<div class="t"><b>${esc(h.name)}</b>
    <span>${esc(f.kind||KINDS[0])}${f.funcNo?" · FUNCTION NO : "+esc(f.funcNo):""}</span></div>
    <span class="tag ${tagCls(f.status)}">${esc(f.status||"Draft")}</span>`;
}

$("#saveBtn").onclick=async()=>{
  if(!CUR) return;
  if(!DB){ toast("บันทึกไม่ได้ในหน้านี้"); return; }
  const body={...CUR}; delete body.id;
  body.total=funcTotal(CUR); body.updatedAt=new Date().toISOString();
  try{
    CUR.id = await sbSaveFunction(CUR.id, body);
    toast("บันทึกแล้ว"); close();
  }catch(e){
    if(e.code==="invalid_argument"){ READONLY=true; toast("บัญชีนี้แก้ไขข้อมูลไม่ได้"); }
    else toast("บันทึกไม่สำเร็จ: "+(e.code||"error"));
  }
};

boot();
